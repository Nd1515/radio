name: Build OldRadio iOS 6

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot rsync curl perl zip git libxml2 libtinfo6 xz-utils libssl-dev libplist-dev dpkg
          sudo apt-get install -y libtinfo5 || true
          if ! command -v ldid >/dev/null 2>&1; then
            sudo apt-get install -y ldid || true
          fi
          if ! command -v ldid >/dev/null 2>&1; then
            git clone --depth 1 https://github.com/ProcursusTeam/ldid.git /tmp/ldid
            make -C /tmp/ldid -j2
            sudo install -m 0755 /tmp/ldid/ldid /usr/local/bin/ldid
          fi
          ldid -v || true

      - name: Install Theos
        env:
          CI: 1
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/theos/theos/master/bin/install-theos)"
          echo "THEOS=$HOME/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDK
        id: sdk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SDK_VERSION="9.3"
          "$THEOS/bin/install-sdk" 9.3 || true
          if [ ! -d "$THEOS/sdks/iPhoneOS9.3.sdk" ]; then
            SDK_VERSION="6.1"
            "$THEOS/bin/install-sdk" 6.1 || true
          fi
          if [ ! -d "$THEOS/sdks/iPhoneOS${SDK_VERSION}.sdk" ]; then
            echo "Neither iPhoneOS9.3.sdk nor iPhoneOS6.1.sdk is available."
            echo "Available SDKs:"
            ls -la "$THEOS/sdks" || true
            exit 1
          fi
          echo "SDK_VERSION=$SDK_VERSION" >> "$GITHUB_ENV"
          ls -la "$THEOS/sdks"

      - name: Build and package
        run: |
          if ! make clean package FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:6.0; then
            echo "make package failed; retrying a plain build."
            make clean all FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:6.0
          fi
          DEB_PATH="$(find .theos -type f -name '*.deb' | head -n 1)"
          if [ -z "$DEB_PATH" ]; then
            echo "No .deb produced; trying a plain build."
            make clean all FINALPACKAGE=1 TARGET=iphone:clang:${SDK_VERSION}:6.0
          fi
          if [ -n "$DEB_PATH" ]; then
            echo "Deb: $DEB_PATH"
            mkdir -p build/root
            dpkg-deb -x "$DEB_PATH" build/root
            APP_PATH="$(find build/root -type d -name 'OldRadio.app' | head -n 1)"
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find .theos -type d -name 'OldRadio.app' -exec test -f '{}/Info.plist' \; -print | head -n 1)"
          fi
          if [ -z "$APP_PATH" ]; then
            APP_PATH="$(find .theos/obj -type d -name 'OldRadio.app' | head -n 1)"
            if [ -n "$APP_PATH" ]; then
              cp -R Resources/. "$APP_PATH"/
            fi
          fi
          if [ -z "$APP_PATH" ]; then
            echo "OldRadio.app not found"
            find .theos -maxdepth 5 -type d || true
            exit 1
          fi
          echo "App bundle: $APP_PATH"
          mkdir -p build/Payload
          rm -rf build/Payload/OldRadio.app
          cp -R "$APP_PATH" build/Payload/
          cd build
          zip -qr OldRadio-unsigned.ipa Payload
          ls -lh OldRadio-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: OldRadio-unsigned-ipa
          path: build/OldRadio-unsigned.ipa
